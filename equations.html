<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Уравнения и системы</title><link rel="stylesheet" href="shared.css"><script src="shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathlive"></script><script src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.js"></script><script src="lib.js"></script></head><body><div class="wrap">
<h1>Уравнения и системы</h1><div class="sub">Системы с двумя переменными (одно уравнение может быть нелинейным), дробно-рациональные и биквадратные уравнения</div>
<div class="tabs" id="tabs"></div>
<div id="p0"><div class="card"><div class="small" style="margin-bottom:6px">Уравнение 1</div><div id="h1"></div><div class="small" style="margin:10px 0 6px">Уравнение 2</div><div id="h2"></div>
<div id="kb0"></div><div class="row"><button class="btn" id="go0">Решить систему</button></div><div id="ex0"></div><div class="err" id="err0"></div></div><div id="plot0"></div><div class="small" style="margin-bottom:14px">Решения системы — точки пересечения графиков обоих уравнений.</div><div id="out0"></div></div>
<div id="p1" hidden><div class="card"><div id="h3"></div><div id="kb1"></div><div class="row"><button class="btn" id="go1">Решить</button></div><div id="ex1"></div><div class="err" id="err1"></div></div><div id="plot1"></div><div class="small" style="margin-bottom:14px">Корни — точки, где график левая − правая часть пересекает ось Ox.</div><div id="out1"></div></div>
</div>
<script>
const pl0=new Plot($('#plot0')),out0=mount('out0');let pl1=null;const out1=mount('out1'),inp=()=>document.activeElement;
tabsInit($('#tabs'),['Системы уравнений','Дробные и биквадратные'],i=>{$('#p0').hidden=i;$('#p1').hidden=!i;if(i&&!pl1){pl1=new Plot($('#plot1'));solve1()}});
const E1=MI($('#h1'),{value:'x + y = 5',onEnter:()=>solve0()}),E2=MI($('#h2'),{value:'x² + y² = 17',onEnter:()=>solve0()}),E3=MI($('#h3'),{value:'(x² − 5)/(x − 1) = 4/(x − 1)',onEnter:()=>solve1()});
kbInit($('#kb0'),['plus','minus','mul','div','frac','sq','pow','sqrt','lp','rp','x','y','eq']);
kbInit($('#kb1'),['plus','minus','mul','div','frac','sq','pow','sqrt','lp','rp','x','eq']);
chipsInit($('#ex0'),['x + y = 5|x² + y² = 17','y = x² − 1|x + y = 1','x·y = 6|x − y = 1','2x + y = 7|x − y = 2','y = x²|y = 2x + 3','x² + y² = 25|y = x + 1'],t=>{const[a,b]=t.split('|');E1.set(a);E2.set(b);solve0()},t=>t.split('|').map(pretty).join('<span style="opacity:.4"> ; </span>'));
chipsInit($('#ex1'),['x⁴ − 5x² + 4 = 0','x⁴ − 13x² + 36 = 0','(x² − 5)/(x − 1) = 4/(x − 1)','1/(x−2) + 1/(x+2) = 1','x/(x−3) = 18/(x²−9) + 1','x² − 5x + 6 = 0'],t=>{E3.set(t);solve1()});
const eq=s=>{const p=s.split('=');if(p.length!==2)throw new Error('в уравнении должен быть один знак «=»: '+s);return{L:p[0],R:p[1],F:compile(`(${p[0]})-(${p[1]})`,['x','y'])}};
function linIn(F,sw){const G=sw?(a,b)=>F(b,a):F;for(const u of [.3,1.7,-2.2,4.1]){const g0=G(u,0),g1=G(u,1),g2=G(u,2);if(![g0,g1,g2].every(isFinite)||Math.abs(g2-2*g1+g0)>1e-8||Math.abs(g1-g0)<1e-9)return null}return u=>-G(u,0)/(G(u,1)-G(u,0))}
function solve0(){$('#err0').textContent='';let A,B;try{A=eq(E1.value);B=eq(E2.value)}catch(e){$('#err0').textContent=e.message;return}
  let pick=null;for(const[P,Q,sw,n] of [[A,B,0,1],[B,A,0,2],[A,B,1,1],[B,A,1,2]]){const phi=linIn(P.F,sw);if(phi){pick={P,Q,sw,n,phi};break}}
  if(!pick){$('#err0').textContent='Пока умею, когда хотя бы одно уравнение линейно по x или по y (так в школьной программе). Выразите переменную из линейного и подставьте.';return}
  const{P,Q,sw,n,phi}=pick,u=sw?'y':'x',v=sw?'x':'y',h=U=>sw?Q.F(phi(U),U):Q.F(U,phi(U)),st=[];
  const lin=polyDeg(phi);
  st.push({t:`Выражаем ${v} из уравнения (${n})`,b:`Уравнение (${n}): <span class="formula">${pretty(P.L)} = ${pretty(P.R)}</span>${lin&&lin.length<=2?`Отсюда <b>${v} = ${polyStr(lin,u)}</b>`:`Отсюда ${v} выражается через ${u}.`}`});
  const ph=polyDeg(h),m=n===1?2:1;let roots=[];
  if(ph&&ph.length===1){const same=Math.abs(ph[0])<1e-9;st.push({t:'Подставляем',b:same?'Уравнения равносильны: подстановка даёт верное равенство при любом значении — <b>бесконечно много решений</b> (прямые совпадают).':'Подстановка даёт неверное равенство (<b>'+num(ph[0])+' = 0</b>) — <b>решений нет</b> (прямые параллельны).'});
    put(out0,stepsHTML(st,same?'бесконечно много решений':'решений нет'));pl0.set([{type:'imp',F:A.F,color:'#2563eb',html:pretty(A.L)+' = '+pretty(A.R)},{type:'imp',F:B.F,color:'#e0412f',html:pretty(B.L)+' = '+pretty(B.R)}],[[0,0],[5,5]]);return}
  roots=findRoots(h,-60,60).roots;
  let b=`Подставляем в уравнение (${m}) вместо ${v}:`+(ph?`<span class="formula">${polyStr(ph,u)} = 0</span>`:'');
  if(ph&&ph.length===3){const[c,bb,a]=ph,D=snap(bb*bb-4*a*c);b+=`D = ${num(D)}${D<0?' &lt; 0 — корней нет.':D===0?' = 0 — один корень.':' &gt; 0 — два корня.'}`}
  b+=roots.length?` Корни: ${roots.map((r,i)=>`${u}${roots.length>1?['₁','₂','₃','₄'][i]:''} = ${num(r)}`).join(', ')}.`:' Действительных корней нет.';st.push({t:`Получаем уравнение с одной переменной ${u}`,b});
  const sols=roots.map(r=>{const w=snap(phi(r),1e-7);return sw?[w,r]:[r,w]});
  if(sols.length)st.push({t:`Находим ${v}`,b:sols.map(([x,y])=>`${u} = ${num(sw?y:x)} → ${v} = ${num(sw?x:y)}`).join('<br>')});
  const bad=sols.filter(([x,y])=>Math.abs(A.F(x,y))>1e-6||Math.abs(B.F(x,y))>1e-6).length;
  if(sols.length)st.push({t:'Проверка',b:sols.map(([x,y])=>`(${num(x)}; ${num(y)}): подставили в оба уравнения — <span class="${Math.abs(A.F(x,y))<1e-6&&Math.abs(B.F(x,y))<1e-6?'ok">верно ✓':'bad">неверно'}</span>`).join('<br>')});
  put(out0,stepsHTML(st,sols.length?sols.map(([x,y])=>`(${num(x)}; ${num(y)})`).join(' &nbsp; '):'решений нет'));
  pl0.set([{type:'imp',F:A.F,color:'#2563eb',html:pretty(A.L)+' = '+pretty(A.R)},{type:'imp',F:B.F,color:'#e0412f',html:pretty(B.L)+' = '+pretty(B.R)},...sols.map(([x,y])=>({type:'pt',x,y,color:'#16a36a',pulse:true,guide:true}))],[[0,0],...sols]);}
function solve1(){$('#err1').textContent='';let E;try{E=eq(E3.value)}catch(e){$('#err1').textContent=e.message;return}
  const g=x=>E.F(x,0),R=findRoots(g,-60,60),p=polyDeg(g),st=[];
  st.push({t:'ОДЗ (область допустимых значений)',b:R.poles.length?`Знаменатель не может быть равен 0: <b>x ≠ ${R.poles.map(num).join(', x ≠ ')}</b>.`:'Знаменателей с переменной нет — x любое.'});
  let roots=R.roots;
  if(p&&p.length===5&&Math.abs(p[1])<1e-9&&Math.abs(p[3])<1e-9){const[c,,b,,a]=p,D=snap(b*b-4*a*c);
    st.push({t:'Биквадратное уравнение: замена t = x²',b:`<span class="formula">${polyStr([c,b,a],'t')} = 0</span>причём <b>t ≥ 0</b> (квадрат не бывает отрицательным). D = ${num(D)}.`});
    if(D>=0){const ts=[...new Set([(-b-Math.sqrt(D))/(2*a),(-b+Math.sqrt(D))/(2*a)].map(t=>snap(t)))].sort((x,y)=>x-y);
      st.push({t:'Возвращаемся к x',b:ts.map(t=>t<0?`t = ${num(t)} &lt; 0 — не подходит (x² не может быть отрицательным).`:t===0?`t = 0 → x² = 0 → x = 0.`:`t = ${num(t)} → x² = ${num(t)} → x = ±${Number.isInteger(Math.sqrt(t))?Math.sqrt(t):rt(num(t))}`).join('<br>')})}}
  else if(p&&p.length===3){const[c,b,a]=p,D=snap(b*b-4*a*c);st.push({t:'Квадратное уравнение',b:`<span class="formula">${polyStr(p)} = 0</span>D = ${num(D)}${D<0?' &lt; 0 — корней нет.':''}`})}
  else if(R.poles.length)st.push({t:'Переносим всё влево и приводим к общему знаменателю',b:`Получаем дробь, равную 0: дробь равна нулю, когда <b>числитель = 0</b>, а знаменатель ≠ 0. Находим такие x:`});
  else st.push({t:'Переносим всё в одну часть',b:`<span class="formula">${p?polyStr(p)+' = 0':'f(x) = 0'}</span>`});
  st.push({t:'Корни и проверка ОДЗ',b:roots.length?roots.map(r=>`x = ${num(r)}: ${Math.abs(g(r))<1e-6?'<span class="ok">подходит ✓</span>':'<span class="bad">не подходит</span>'}`).join('<br>')+(R.poles.length?'<br><span class="small">Если в процессе получился корень, равный x из ОДЗ, он посторонний и отбрасывается — его нет в списке.</span>':''):'Действительных корней нет.'});
  put(out1,stepsHTML(st,roots.length?roots.map((r,i)=>`x${roots.length>1?['₁','₂','₃','₄','₅','₆'][i]||'':''} = ${num(r)}`).join(', &nbsp; '):'корней нет'));
  if(pl1)pl1.set([{type:'fn',f:g,color:'#2563eb',html:'y = (левая часть) − (правая часть)'},...R.poles.map(x=>({type:'vline',x,color:'#9333ea'})),...roots.map(x=>({type:'pt',x,y:0,color:'#16a36a',pulse:true,label:`x = ${dec(x)}`}))],[[0,0],...roots.map(x=>[x,0]),...R.poles.map(x=>[x,0])])}
$('#go0').onclick=solve0;$('#go1').onclick=solve1;solve0();
</script></body></html>
