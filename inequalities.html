<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Неравенства</title><link rel="stylesheet" href="shared.css"><script src="shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathlive"></script><script src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.js"></script><script src="lib.js"></script></head><body><div class="wrap">
<h1>Неравенства</h1><div class="sub">Линейные, квадратные, дробно-рациональные (метод интервалов), системы и двойные неравенства. Каждое неравенство — с новой строки (это система).</div>
<div class="card"><div id="list"></div><div id="kb"></div>
<div class="row"><button class="btn" id="go">Решить</button><button class="btn g" id="clr">Очистить</button></div><div id="ex"></div><div class="err" id="err"></div></div>
<div id="out"></div></div>
<script>
const LIST=MathList($('#list'),{onEnter:()=>run()}),out=mount('out'),SY={'>':'>','<':'<','>=':'≥','<=':'≤'};
kbInit($('#kb'),['plus','minus','mul','div','frac','sq','pow','sqrt','abs','lp','rp','x','lt','gt','le','ge']);
chipsInit($('#ex'),['3x − 5 > 7','-2x + 4 >= 10','x² − 5x + 6 ≤ 0','(x − 1)(x + 3) > 0','(x − 2)/(x + 1) ≥ 0','2x − 1 > 3\n5 − x ≥ 1','x² − 4 < 0\nx > 0','-1 < 2x + 3 ≤ 7','x² + 1 > 0'],t=>{LIST.set(t.split('\n'));run()});
function parseLines(txt){const R=[];txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(raw=>{
  const s=raw.replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/=</g,'<=').replace(/=>/g,'>=');const p=s.split(/(<=|>=|<|>)/);
  if(p.length!==3&&p.length!==5)throw new Error('нужен знак неравенства (<, >, ≤, ≥): '+raw);
  for(let i=0;i+2<p.length;i+=2)R.push({raw:`${p[i].trim()} ${SY[p[i+1]]} ${p[i+2].trim()}`,op:p[i+1],g:compile(`(${p[i]})-(${p[i+2]})`),lhs:p[i],rhs:p[i+2]})});return R}
const okV=(op,v,pt)=>{if(!isFinite(v))return false;const e=pt?1e-9:0;return op==='>'?v>e:op==='<'?v<-e:op==='>='?v>=-e:v<=e}
function critOf(cs){const s=new Set(),poles=new Set();cs.forEach(c=>{const R=findRoots(c.g,-100,100);R.roots.forEach(r=>s.add(r));R.poles.forEach(r=>{s.add(r);poles.add(r)})});return[...s].sort((a,b)=>a-b)}
function solveSet(cs,cr){const E=[];const n=cr.length;
  if(!n)return{cr,E:[{iv:true,inc:cs.every(c=>okV(c.op,c.g(0),false)),s:0}]};
  for(let i=0;i<=n;i++){const s=i===0?cr[0]-1:i===n?cr[n-1]+1:(cr[i-1]+cr[i])/2;E.push({iv:true,s,inc:cs.every(c=>okV(c.op,c.g(s),false))});if(i<n)E.push({iv:false,s:cr[i],inc:cs.every(c=>okV(c.op,c.g(cr[i]),true))})}
  return{cr,E}}
function intervals(S){const{cr,E}=S,R=[];let i=0;while(i<E.length){if(!E[i].inc){i++;continue}let j=i;while(j+1<E.length&&E[j+1].inc)j++;
  const k0=Math.floor((i+1)/2),k1=Math.floor((j+1)/2)-1; // индексы критических точек: слева/справа от элементов
  const L=E[i].iv?(i===0?-Infinity:cr[i/2-1]):cr[(i-1)/2],Rr=E[j].iv?(j===E.length-1?Infinity:cr[j/2]):cr[(j-1)/2];
  R.push({a:L,b:Rr,ca:!E[i].iv,cb:!E[j].iv});i=j+1}return R}
function ivHTML(R){if(!R.length)return'решений нет (∅)';if(R.length===1&&R[0].a===-Infinity&&R[0].b===Infinity)return'x — любое число, x ∈ (−∞; +∞)';
  return'x ∈ '+R.map(r=>`${r.ca?'[':'('}${num(r.a)}; ${num(r.b)}${r.cb?']':')'}`).join(' ∪ ')}
function svgNum(v,cx,y){const f=toFr(v,12),st='font-size="14" font-weight="600" fill="#1d2433" text-anchor="middle"';if(f&&f[1]>1){const n=String(Math.abs(f[0])),d=String(f[1]),w=Math.max(n.length,d.length)*4.4+3;
  return`<text x="${cx}" y="${y-3}" ${st}>${f[0]<0?'−':''}${n}</text><line x1="${cx-w}" x2="${cx+w}" y1="${y}" y2="${y}" stroke="#1d2433" stroke-width="1.4"/><text x="${cx}" y="${y+14}" ${st}>${d}</text>`}
  return`<text x="${cx}" y="${y+6}" ${st}>${numT(v)}</text>`}
function numberLine(S,sol,label){const{cr,E}=S,n=cr.length,W=680,x=i=>n?70+(i+1)*(W-140)/(n+1):W/2;let g=`<line x1="14" y1="64" x2="${W-18}" y2="64" stroke="#1d2433" stroke-width="2"/><path d="M${W-8} 64l-11-5v10z" fill="#1d2433"/>`;
  const px=k=>k<0?14:k>=n?W-18:x(k);
  E.forEach((e,i)=>{if(!e.iv)return;const k=i/2;const a=k===0?14:x(k-1),b=k===n?W-18:x(k);
    g+=`<text x="${(a+b)/2}" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="${e.sgn>0?'#16a36a':'#dc2626'}">${e.sgn>0?'+':'−'}</text>`;
    if(sol[i])g+=`<line x1="${a}" y1="64" x2="${b}" y2="64" stroke="#3b6fe0" stroke-width="8" opacity=".45" stroke-linecap="round"/>`;});
  cr.forEach((c,k)=>{const inc=sol[2*k+1];g+=`<circle cx="${x(k)}" cy="64" r="7" fill="${inc?'#3b6fe0':'#fff'}" stroke="#3b6fe0" stroke-width="2.5"/>${svgNum(c,x(k),88)}`});
  return`<div class="small" style="margin-top:6px">${label}</div><svg viewBox="0 0 ${W} 112" style="width:100%;max-width:${W}px">${g}</svg>`}
function stepsFor(c,i){const p=polyDeg(c.g),o=SY[c.op];let b='';
  if(p&&p.length===2){const[B,A]=p;b+=`Переносим всё в левую часть: <span class="formula">${polyStr(p.slice())} ${o} 0</span>`;
    b+=`Перенесём свободный член: <span class="formula">${polyStr([0,A],'x')} ${o} ${num(snap(-B))}</span>`;
    const flip=A<0,o2=flip?{'>':'<','<':'>','>=':'<=','<=':'>='}[c.op]:c.op;
    b+=`Делим на ${num(A)}${flip?' — число <b>отрицательное</b>, поэтому знак неравенства <b>меняется на противоположный</b>':''}: <span class="formula">x ${SY[o2]} ${num(snap(-B/A))}</span>`}
  else if(p&&p.length===3){const[C,B,A]=p,D=snap(B*B-4*A*C);b+=`Квадратное неравенство: <span class="formula">${polyStr(p)} ${o} 0</span>a = ${num(A)}, b = ${num(B)}, c = ${num(C)}; D = ${num(D)}. `;
    b+=D<0?`D < 0 → корней нет, парабола ${A>0?'целиком выше':'целиком ниже'} оси Ox.`:`Корни: ${D===0?'x = '+num(snap(-B/(2*A))):'x₁ = '+num(snap((-B-Math.sqrt(D))/(2*A)))+', x₂ = '+num(snap((-B+Math.sqrt(D))/(2*A)))}. Ветви параболы ${A>0?'вверх':'вниз'}.`;
    b+=`<br>Решаем <b>методом интервалов</b>: отмечаем корни на прямой, определяем знак на каждом промежутке.`}
  else b+=`Преобразуем к виду <span class="formula">f(x) ${o} 0</span>где f(x) = ${pretty(c.lhs)} − (${pretty(c.rhs)}). Находим нули числителя и значения x, при которых знаменатель = 0 (они всегда <b>выколоты</b>). Дальше — метод интервалов.`;
  return{t:`Неравенство ${i}: ${pretty(c.raw)}`,b}}
function run(){$('#err').textContent='';let cs;try{cs=parseLines(LIST.values().join('\n'));if(!cs.length)return}catch(e){$('#err').textContent=e.message;return}
  const st=[];let all=critOf(cs);
  cs.forEach((c,i)=>{const cr=critOf([c]),S=solveSet([c],cr);S.E.forEach(e=>{if(e.iv)e.sgn=c.g(e.s)>0?1:-1});const sol=S.E.map(e=>e.inc),R=intervals(S),s=stepsFor(c,i+1);
    s.b+=numberLine(S,sol,'Знаки f(x) и решение (закрашено):')+`<div style="margin-top:4px"><b>${ivHTML(R)}</b></div>`;st.push(s)});
  const S=solveSet(cs,all);let ans;
  if(cs.length>1){S.E.forEach(e=>{if(e.iv)e.sgn=cs[0].g(e.s)>0?1:-1});const R=intervals(S);st.push({t:'Пересечение решений (решение системы)',b:`Ответ системы — общая часть всех решений.`+numberLine(S,S.E.map(e=>e.inc),'Общее решение (закрашено):')});ans=ivHTML(R)}
  else ans=ivHTML(intervals(solveSet(cs,all)));
  put(out,stepsHTML(st,ans))}
$('#go').onclick=run;$('#clr').onclick=()=>{LIST.set(['']);put(out,'')};LIST.set(['x² − 5x + 6 ≤ 0']);run();
</script></body></html>
