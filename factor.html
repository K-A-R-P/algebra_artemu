<script>

function mTwo(f){const p=f.p;if(p.size!==2)return null;const[t1,t2]=P.list(p),ps=[t1,t2].find(t=>t.c[0]>0),ng=[t1,t2].find(t=>t.c[0]<0);
  if(ps&&ng){const a=rootTerm(ps,2),b=rootTerm({c:Fr.neg(ng.c),e:ng.e},2);if(a&&b)return{t:'Формула разности квадратов',b:`a² − b² = (a − b)(a + b)<br>${polyH(P.sub([ps],[0]))} = (${polyH(a)})², ${polyH(P.neg(P.sub([ng],[0])))} = (${polyH(b)})², значит a = <b>${polyH(a)}</b>, b = <b>${polyH(b)}</b>.`,parts:[{p:P.add(a,P.neg(b))},{p:P.add(a,b)}]}}

function mRoot(f){const p=f.p;if(P.vars(p).length!==1||P.deg(p,P.vars(p)[0])<3)return null;const{v,c}=uni(p),n=c.length-1,a0=Math.abs(c[0][0]),an=Math.abs(c[n][0]);if(c.some(k=>k[1]!==1)||!a0)return null;

  const tried=[];for(const r of cand){const val=evalU(c,r);tried.push(`${v} = ${num(r[0]/r[1])}: ${Fr.z(val)?'<b>= 0 ✓</b>':'≠ 0'}`);if(Fr.z(val)){
    const qc=Array(n).fill(0);let carry=[0,1];for(let i=n;i>=1;i--){carry=Fr.add(c[i],Fr.mul(carry,r));qc[i-1]=carry}const qr=qc.map(k=>Fr.mul(k,[1,r[1]])),Q=fromUni(v,qr);
    return{t:'Подбор корня и деление многочлена',b:`Целые корни ищем среди делителей свободного члена ${c[0][0]}; дробные — вида (делитель свободного члена) / (делитель старшего коэффициента). Пробуем:<br>${tried.slice(0,8).join('; ')}<br>Значит ${v} = ${num(r[0]/r[1])} — корень, и многочлен делится на (${polyH(lin(r[1],v,r[0]))}). Делим (по схеме Горнера или уголком): частное = <b>${polyH(Q)}</b>.`,parts:[{p:lin(r[1],v,r[0])},{p:Q}]}}}return null}
function mBiquad(f){const p=f.p,vs=P.vars(p);if(vs.length!==1||p.size!==3)return null;const v=vs[0];let A=0,B=0,C=0;for(const t of p.values()){const d=t.e[v]||0;if(t.c[1]!==1)return null;if(d===4)A=t.c[0];else if(d===2)B=t.c[0];else if(d===0)C=t.c[0];else return null}
  if(!A||!B||!C)return null;const D=B*B-4*A*C,r=isq(D);if(r===null)return null;const t1=Fr.mk(-B-r,2*A),t2=Fr.mk(-B+r,2*A),m=q=>P.add(monoP([q[1],1],{[v]:2}),P.const([-q[0],1])),k=A/(t1[1]*t2[1]);
  return{t:`Биквадратный трёхчлен: замена t = ${v}²`,b:`Пусть t = ${v}², тогда ${polyH(monoP([A,1],{t:2}))}${B<0?' − ':' + '}${Math.abs(B)}t${C<0?' − ':' + '}${Math.abs(C)}. D = ${D}, t₁ = ${num(t1[0]/t1[1])}, t₂ = ${num(t2[0]/t2[1])}.<br>Раскладываем: a(t − t₁)(t − t₂), затем возвращаем t = ${v}²:`,parts:[...(k!==1?[{p:P.const([k,1]),done:true}]:[]),{p:m(t1)},{p:m(t2)}]}}
function mGroup2(f){const p=f.p,L=P.list(p),n=L.length;if(n<4||n>6)return null;const comb=(arr,k)=>k===0?[[]]:arr.flatMap((x,i)=>comb(arr.slice(i+1),k-1).map(c=>[x,...c])),parts=[];
  (function gen(rem,cur){if(!rem.length){parts.push(cur);return}const[a,...rest]=rem;for(const k of[1,2])for(const c of comb(rest,k))gen(rest.filter(x=>!c.includes(x)),[...cur,[a,...c]])})([...Array(n).keys()],[]);
  for(const part of parts){if(part.length<2)continue;const G=part.map(gr=>{const sp=P.sub(L,gr),r=factorize(sp,[]).F;return{sp,F:r}});if(G.some(g=>g.F.some(x=>!x.p)))continue;
    const cand=G[0].F.filter(x=>x.p.size>1||P.vars(x.p).length);for(const c of cand){if(c.p.size===1)continue;const k=ckey(c.p);if(!G.every(g=>g.F.some(x=>ckey(x.p)===k)))continue;
      let S=new Map();for(const g of G){let used=false,rest=P.const([1,1]);for(const x of g.F){if(!used&&ckey(x.p)===k){used=true;continue}rest=P.mul(rest,x.p)}S=P.add(S,rest)}
      if(S.size<1||!P.vars(S).length)continue;return{t:'Группировка + формулы сокращённого умножения',b:`Группируем: ${G.map(g=>`(${polyH(g.sp)})`).join(' + ')}<br>Раскладываем каждую группу: ${G.map(g=>prodH(g.F)).join(' + ')}<br>Во всех группах есть общий множитель (${polyH(c.p)}) — выносим его: (${polyH(c.p)})·(${polyH(S)}).`,parts:[{p:c.p},{p:S}]}}}return null}
let ADV=false;
const methods=()=>ADV?[mCommon,mTwo,mSquare,mCube,mGroup,mGroup2,mQuad,mBiquad,mRoot]:[mCommon,mTwo,mSquare,mGroup,mGroup2,mQuad,mBiquad];
function factorize(P0,pre,initF,start){const F=initF||[{p:P0,top:true}],steps=[...pre];let g=0,first=true;
  while(g++<60){const i=F.findIndex(f=>!f.done);if(i<0)break;const f=F[i];if(!f.p||f.p.size<=1||!P.vars(f.p).length){f.done=true;continue}
    let r=null;for(const m of methods()){r=m(f);if(r)break}
    if(!r){f.done=true;f.stuck=true;continue}F.splice(i,1,...r.parts.map(x=>({...x,top:false})));
    steps.push({t:r.t,b:r.b+((r.parts.length===1&&r.parts[0].irr)?'':`<span class="formula">${first&&start?start+' = ':'= '}${prodH(F)}</span>`)});first=false}
  return{steps,F}}
function flatP(n){while(n.type==='ParenthesisNode')n=n.content;
  if(n.type==='OperatorNode'&&n.fn==='multiply')return[...flatP(n.args[0]),...flatP(n.args[1])];
  if(n.type==='OperatorNode'&&n.fn==='unaryMinus')return[P.const([-1,1]),...flatP(n.args[0])];
  if(n.type==='OperatorNode'&&n.fn==='pow'){let b=n.args[0],e=n.args[1];while(b.type==='ParenthesisNode')b=b.content;while(e.type==='ParenthesisNode')e=e.content;
    if(e.type==='ConstantNode'&&+e.value>=2&&+e.value<=6&&Number.isInteger(+e.value)&&b.type==='OperatorNode'&&(b.fn==='add'||b.fn==='subtract'))return Array(+e.value).fill(0).flatMap(()=>flatP(b))}
  return[fromAST(n)]}
function rawSum(A,B){const L=[];for(const x of P.list(A))for(const y of P.list(B)){const e={...x.e};for(const v in y.e)e[v]=(e[v]||0)+y.e[v];L.push({c:Fr.mul(x.c,y.c),e})}return polyHL(L)}
function checkStep(F,orig){if(F.some(f=>!f.p))return null;let prod=P.const([1,1]);F.forEach(f=>prod=P.mul(prod,f.p));if(!P.eq(prod,orig))return null;
  const nc=F.filter(f=>P.vars(f.p).length),cs=F.filter(f=>!P.vars(f.p).length).reduce((m,f)=>P.mul(m,f.p),P.const([1,1])),cst=[...cs.values()][0],cf=cst&&!(cst.c[0]===1&&cst.c[1]===1)?facH(cst.c,{}):'',ch=[prodH(F)];
  if(nc.length===2){const raw=rawSum(nc[0].p,nc[1].p),comb=polyH(P.mul(nc[0].p,nc[1].p));ch.push(cf?`${cf}(${raw})`:raw);if(raw!==comb)ch.push(cf?`${cf}(${comb})`:comb);if(cf)ch.push(polyH(prod))}
  else ch.push(polyH(prod));
  return{t:'Проверка',b:`Раскроем скобки и приведём подобные слагаемые — должен получиться исходный многочлен:<span class="formula">${[...new Set(ch)].join(' = ')}</span>Получили ${polyH(orig)} — совпадает с исходным ✓`}}
/* ===== интерфейс ===== */
const mi=MI($('#inp'),{placeholder:'Введи многочлен, например x² − 10x + 9',onEnter:()=>run()}),out=mount('out');
kbInit($('#kb'),['plus','minus','mul','div','frac','sq','pow','lp','rp','x','y','a','b']);
chipsInit($('#ex'),['x² − 10x + 9','x² + 2x − 15','2x² − 5x + 2','3y² + 36y + 60','3a² − 75','x⁴ − 16','a³ + 8','27x³ − 1','4x² + 12x + 9','x² − 2xy + y²','x³ − 2x² − 4x + 8','ax + ay + bx + by','a² − b² + a + b','x² + 5xy + 6y²','x² − 2x − 1','x² + x + 1','x⁴ − 5x² + 4','(x − 1)(x − 9)'],t=>{mi.set(t);run()});
function run(){$('#err').textContent='';ADV=$('#adv').checked;const src=mi.value;if(!src.trim()){put(out,'');return}let p,node,fl;
  try{node=math.parse(normExpr(src));p=fromAST(node);fl=flatP(node)}catch(e){$('#err').textContent=(e&&e.message)||'Не получилось разобрать выражение';return}
  if(!p.size){put(out,stepsHTML([{t:'Результат',b:'Выражение равно 0.'}]));return}
  const isProd=fl.length>=2&&fl.filter(q=>P.vars(q).length).length>=2&&fl.some(q=>q.size>1);let steps,F,start,pre=[],init=null;
  if(isProd){init=fl.map(q=>({p:q,done:q.size<=1}));start=prodH(init);pre=[{t:'Исходное выражение',b:`Оно уже записано как произведение — проверим, нельзя ли разложить каждый множитель:<span class="formula">${start}</span>`}]}
  else{start=polyH(p);if(/\(/.test(src))pre=[{t:'Раскрываем скобки',b:`Раскрываем скобки и приводим подобные слагаемые:<span class="formula">${start}</span>`}]}
  ({steps,F}=factorize(p,pre,init,start));const changed=steps.length>pre.length,res=prodH(F);let ans;
  if(isProd&&!changed)ans=`${start} — уже разложено на множители, дальше не раскладывается`;
  else if(!changed){const m=P.vars(p);const hint=!ADV&&m.length===1&&P.deg(p,m[0])>=3?' Для многочленов 3-й и 4-й степени есть подбор корня — он включается в расширенном режиме.':'';
    steps.push({t:'Вывод',b:`Нет общего множителя, не подходит ни одна формула сокращённого умножения, группировка и квадратный трёхчлен.${hint}`});ans=`${polyH(p)} — не раскладывается`}
  else if(F.length===1&&!isProd&&P.eq(F[0].p,p)){ans=`${polyH(p)} — не раскладывается над действительными числами, потому что D < 0`}
  else{const ck=isProd?null:checkStep(F,p);if(ck)steps.push(ck);ans=`${isProd?start:polyH(p)} = ${res}`}
  put(out,stepsHTML(steps,ans))}
$('#go').onclick=run;$('#adv').onchange=run;mi.set('x² − 10x + 9');run();$('#clr').onclick=()=>{mi.set('');put(out,'');mi.focus()};
$('#ref').innerHTML=[['Общий множитель','ab + ac = a(b + c)'],['Разность квадратов','a² − b² = (a − b)(a + b)'],['Квадрат суммы','a² + 2ab + b² = (a + b)²'],['Квадрат разности','a² − 2ab + b² = (a − b)²'],['Сумма кубов','a³ + b³ = (a + b)(a² − ab + b²)'],['Разность кубов','a³ − b³ = (a − b)(a² + ab + b²)'],['Группировка','ax + ay + bx + by = a(x + y) + b(x + y) = (a + b)(x + y)'],['Теорема Виета (a = 1)','x² + bx + c = (x − x₁)(x − x₂), где x₁ + x₂ = −b, x₁·x₂ = c'],['Квадратный трёхчлен','ax² + bx + c = a(x − x₁)(x − x₂), x₁,₂ = (−b ± √D) / 2a'],['Расширенный режим','(a ± b)³; подбор корня многочлена 3–4 степени']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('');
