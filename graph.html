let fns=[],marks=[];
function analyze(f){const R=findRoots(f),ex=extrema(f),poly=polyDeg(f),yl=f(1e7),yr=f(-1e7);

const li=s=>`<li>${s}</li>`;
function domainInfo(f,A){const N=4000,a=-100,b=100,h=(b-a)/N,tr=[];let prev=null,xs=a;

/* ===== пошаговое вычисление значения функции ===== */
const FR={mk:(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return[n/g,d/g]},add:(a,b)=>FR.mk(a[0]*b[1]+b[0]*a[1],a[1]*b[1]),sub:(a,b)=>FR.mk(a[0]*b[1]-b[0]*a[1],a[1]*b[1]),mul:(a,b)=>FR.mk(a[0]*b[0],a[1]*b[1]),div:(a,b)=>{if(!b[0])throw 0;return FR.mk(a[0]*b[1],a[1]*b[0])}};

const numF=v=>(v[0]<0?'−':'')+(v[1]===1?Math.abs(v[0]):frHTML(Math.abs(v[0]),v[1]));

  case'op':{const o=t.o;if(o==='/')return frHTML(rd(t.a,'frac'),rd(t.b,'frac'));if(o==='^')return rd(t.a,'base')+`<sup>${rd(t.b,'sup')}</sup>`;
    if(o==='*')return rd(t.a,'mul')+' · '+rd(t.b,'mul');if(NORM&&t.b.t==='n'&&t.b.v[0]<0)return rd(t.a,'sum')+(o==='+'?' − ':' + ')+numF([-t.b.v[0],t.b.v[1]]);return rd(t.a,'sum')+(o==='+'?' + ':' − ')+(t.b.t==='n'&&t.b.v[0]<0?`(${numF(t.b.v)})`:rd(t.b,'sumr'))}}}
const evl=t=>(t.t==='op'&&t.a.t==='n'&&t.b.t==='n')||((t.t==='neg'||t.t==='f')&&t.a.t==='n');
const cls=t=>(t.t==='f'||(t.t==='op'&&t.o==='^'))?1:(t.t==='neg'||(t.t==='op'&&(t.o==='*'||t.o==='/')))?2:3;
function calc(t){const a=t.a.v,b=t.b&&t.b.v;if(t.t==='neg')return[-a[0],a[1]];
  if(t.t==='f'){if(t.f==='abs')return[Math.abs(a[0]),a[1]];const n=Math.sqrt(a[0]),d=Math.sqrt(a[1]);if(a[0]<0||n%1||d%1)throw 0;return FR.mk(n,d)}

function minCls(t){let m=9;(function w(t){if(t.t==='n'||t.t==='p')return;if(t.a)w(t.a);if(t.b)w(t.b);if(evl(t))m=Math.min(m,cls(t))})(t);return m}
function evalAll(t,c){if(t.t==='n'||t.t==='p')return t;const u={...t};if(t.a)u.a=evalAll(t.a,c);if(t.b)u.b=evalAll(t.b,c);return(evl(t)&&cls(t)<=c)?{t:'n',v:calc(t)}:u}
const badPar=t=>t.t==='p'?t.a.t!=='n':(t.a&&badPar(t.a))||(t.b&&badPar(t.b));
function mapBad(t){if(t.t==='n')return t;if(t.t==='p'){if(t.a.t==='n')return t;const s=stepT(t.a);if(!s)return t;return s.t==='n'?s:{t:'p',a:s}}const r={...t};if(t.a)r.a=mapBad(t.a);if(t.b)r.b=mapBad(t.b);return r}
function sumAll(t){if(t.t==='n'||t.t==='p')return t;const u={...t};if(t.a)u.a=sumAll(t.a);if(t.b)u.b=sumAll(t.b);return(u.t==='op'&&(u.o==='+'||u.o==='-')&&u.a.t==='n'&&u.b.t==='n')?{t:'n',v:calc(u)}:u}

function chainFor(fn,x){const y=fn.f(x);if(!isFinite(y))return{html:'функция не определена',y:NaN};

function domBounds(f){const N=4000,a=-100,h=200/N,o={lo:null,hi:null},df=x=>!isNaN(f(x));let prev=null;

const divs=n=>{n=Math.abs(n);const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r};
function tableXs(fn,A){const c=A.poly,sq9=x=>Array.from({length:9},(_,i)=>x+i-4);

    if(fa&&fa[1]>1){const q=fa[1],r=Math.round(Math.sqrt(q));step=r*r===q?r:q;if(step>6)step=1;else{const nm=fa[0]===1?{2:'половина',3:'треть',4:'четверть',5:'пятая часть'}[q]:null;

  if(A.hyper)return`Гипербола не принимает значение горизонтальной асимптоты y = ${CF(A.hyper.n)}, а все остальные значения — принимает.`;

const QI='<svg class="qi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" aria-hidden="true"><!-- Icon from Streamline color by Streamline - https://creativecommons.org/licenses/by/4.0/ --><g fill="none"><path fill="#8fbffa" d="M0 7a7 7 0 1 0 14 0A7 7 0 1 0 0 7"/><path fill="#2859c5" d="M5.75 5.25A1.25 1.25 0 1 1 7 6.5a.75.75 0 0 0-.75.75v.646a.75.75 0 1 0 1.5 0a2.751 2.751 0 1 0-3.5-2.646a.75.75 0 0 0 1.5 0M7 11.5a1 1 0 1 0 0-2a1 1 0 0 0 0 2"/></g></svg>';

function extInfo(fn,A,fam){const p=fam.params;let mn=[],mx=[];

  else if(!['line','const','hyperbola','sqrt'].includes(fam.type))A.ext.slice(0,6).forEach(e=>(e.min?mn:mx).push(e));
  const L=(a,nm)=>a.length?a.map(e=>`x<sub>${nm}</sub> = ${TB(e.x)}, y<sub>${nm}</sub> = ${TB(e.y)}`).join('; '):`${nm==='min'?'минимума':'максимума'} нет`;

  let explain='Точка экстремума — это точка, где функция меняет возрастание на убывание (максимум) или убывание на возрастание (минимум). На графике это «вершина горки» или «дно ямки».';
  if(fam.type==='parabola')explain=`Вершина параболы — единственная точка экстремума. Ветви направлены ${p.a>0?'вверх':'вниз'}, поэтому вершина — самая ${p.a>0?'низкая':'высокая'} точка графика: это точка <b>${p.a>0?'минимума':'максимума'}</b>. Слева от неё функция ${p.a>0?'убывает':'возрастает'}, справа — ${p.a>0?'возрастает':'убывает'}. ${p.a>0?'Максимума':'Минимума'} нет: ветви уходят в бесконечность.`;
  else if(fam.type==='abs'&&p)explain=`Вершина «галочки» — единственная точка экстремума: ветви направлены ${p.k>0?'вверх, значит это <b>минимум</b>':'вниз, значит это <b>максимум</b>'}.`;

function card(fn){const A=fn.A,c=A.poly;const fam=detectFamily(fn.expr,A);let h=`<h3 style="color:${fn.color}">y = ${pretty(fn.expr)}</h3><div style="font-weight:800;margin:2px 0 10px;line-height:1.5">${summary(fam,A)}</div><ul class="info">`;
  /* --- 1. Тип и коэффициенты --- */
  if(c&&c.length===1)h+=li(`<b>Постоянная функция</b>: график — горизонтальная прямая y = ${CF(c[0])}.`);
  else if(c&&c.length===2){const[b,k]=c;h+=li(`<b>Линейная функция</b> y = kx + b: k = ${CF(k)}, b = ${CF(b)}.`)

    +li(`Прямая задаётся двумя точками: (0; ${CF(b)}) и (${CF(snap(-b/k))}; 0). Отметь их и проведи линейку.`)}

      +li(Math.abs(a)>1?`|a| = ${CF(Math.abs(a))} > 1 — парабола «уже», чем y = x².`:Math.abs(a)<1?`|a| = ${CF(Math.abs(a))} < 1 — парабола «шире», чем y = x².`:'|a| = 1 — такая же форма, как у y = x².')
      +li(`<b>Вершина:</b> x₀ = −${frHTML('b','2a')} = <b>${S(x0)}</b>, y₀ = <b>${S(V.y0)}</b>`)}
  else if(A.hyper){const{k,m,n}=A.hyper;h+=li(`<b>Гипербола</b> y = ${frHTML('k','x − m')} + n: k = ${CF(k)}, m = ${CF(m)}, n = ${CF(n)}.`)
    +li(`Центр симметрии — точка (${CF(m)}; ${CF(n)}). Асимптоты: x = ${CF(m)} и y = ${CF(n)} — к ним график приближается, но не касается.`)
    +li(k>0?'k > 0 — ветви в I и III «четвертях» относительно центра.':'k < 0 — ветви в II и IV «четвертях» относительно центра.')

  else if(fam.type==='sqrt')h+=li(`<b>Квадратный корень</b> определён только там, где подкоренное выражение неотрицательно. График — «половина параболы, лежащей на боку»; чем дальше вправо, тем медленнее он растёт.`);
  else if(fam.type==='abs')h+=li('<b>Модуль</b> не бывает отрицательным: график состоит из двух лучей, сходящихся в вершине («галочка»).');
  else h+=li('Функция общего вида. Чтобы построить график, составь таблицу значений и соедини точки плавной линией.');
  if(A.ha!==null&&!A.hyper&&A.poles.length)h+=li(`Горизонтальная асимптота: y = ${CF(A.ha)}.`);
  /* --- Свойства функции --- */
  const P=[];
  P.push(acc(`<b>Область определения:</b> D(f) = ${domainInfo(fn.f,A)}.`,domainExplain(fn,A,fam)));
  P.push(acc(`<b>Область значений:</b> E(f) = ${rangeInfo(fn.f,A)}.`,rangeExplain(fn,A,fam)));
  const zb=zerosContent(fn,A,fam)+(c&&c.length===3?box('Про дискриминант: сколько бывает корней',dExplain(snap(c[1]*c[1]-4*c[2]*c[0]))):'');
  P.push(acc(`<b>Нули функции</b> (y = 0, пересечение с Ox): ${A.roots.length?'x = '+A.roots.map(TB).join('; ')+'.':'нулей нет — график <b>не пересекает</b> ось Ox.'}`,zb));
  if(A.yint!==null){const ch=chainFor(fn,0);P.push(acc(`<b>Пересечение с осью Oy</b> (x = 0): точка <b>(0; ${CF(snap(A.yint))})</b>.`,`Ось Oy — вертикальная ось, где <b>x всегда равен 0</b>. Подставим x = 0 в формулу:<span class="formula">y(0) = ${ch.html}</span>`+(c&&c.length===3?'Это свободный член <b>c</b> — у любой параболы y = ax² + bx + c график пересекает Oy в (0; c).':'')))}

  const mono=monoInfo(fn,A,fam);if(mono){const me=monoExplain(fn,A,fam);P.push(me?acc(`<b>Промежутки монотонности:</b> ${mono}.`,me):prow(`<b>Промежутки монотонности:</b> ${mono}.`))}
  const ex=extInfo(fn,A,fam);P.push(acc(`<b>Экстремумы:</b> ${ex.head}`,ex.explain));
  h+=`</ul><div class="props"><div class="props-h">Свойства функции</div>${P.join('')}</div>`;
  return`<div class="info" style="margin-bottom:22px;padding-bottom:6px;border-bottom:1px solid var(--bd)">${h}${solutionHTML(fn,A)}</div>`}
function build(){$('#err').textContent='';tipStore.length=0;

      if(A.hyper){items.push({type:'pt',x:A.hyper.m,y:A.hyper.n,color:fn.color,pulse:true,guide:true,nolabel:true});P.push([A.hyper.m,A.hyper.n])}}

function subst(expr,xv){const f=toFr(xv,16),s=f?(f[1]===1?String(f[0]):`(${f[0]}/${f[1]})`):String(xv);return pretty(expr.replace(/(?<![a-z])x(?![a-z])/g,`(${s})`))}

function subst(expr,xv){const f=toFr(xv,16),s=f?(f[1]===1?String(f[0]):`(${f[0]}/${f[1]})`):String(xv);return pretty(expr.replace(/(?<![a-z])x(?![a-z])/g,`(${s})`))}

function refine(g,x){for(let i=0;i<8;i++){const h=1e-6,d=(g(x+h)-g(x-h))/(2*h);if(!isFinite(d)||Math.abs(d)<1e-12)break;const nx=x-g(x)/d;if(!isFinite(nx))break;x=nx}return x}
function quadExact(fn,y,R){const c=fn.A.poly;if(!c||c.length!==3||R.length!==2)return null;const a=c[2],b=c[1],D=b*b-4*a*(c[0]-y);if(!Number.isInteger(D)||D<=0||Number.isInteger(Math.sqrt(D)))return null;
