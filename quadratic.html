<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Квадратичная функция</title><link rel="stylesheet" href="shared.css"><script src="shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathlive"></script><script src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.js"></script><script src="lib.js"></script></head><body><div class="wrap">
<h1>Квадратичная функция</h1><div class="sub">y = ax² + bx + c: вершина, ось симметрии, нули, промежутки; преобразования графиков</div>
<div class="tabs" id="tabs"></div>
<div id="p0"><div class="card"><div class="row" style="margin-top:0">
<label>a =<span id="ha"></span></label><label>b =<span id="hb"></span></label><label>c =<span id="hc"></span></label>
<button class="btn" id="go">Исследовать</button></div><div class="small" style="margin-top:8px">Можно дробями: 1/2, −3/4</div><div class="err" id="err"></div><div id="ex"></div></div>
<div id="plot0"></div><div class="small" style="margin-bottom:14px">Колесо — масштаб · перетаскивание — сдвиг · двойной клик — сброс</div><div id="out"></div></div>
<div id="p1" hidden><div class="card"><div class="row" style="margin-top:0"><label>базовая функция
<select id="base" style="width:auto;font-size:15px;padding:6px 10px"><option value="0">y = x²</option><option value="1">y = x³</option><option value="2">y = |x|</option><option value="3">y = √x</option><option value="4">y = 1/x</option></select></label></div>
<div class="grid2" style="margin-top:12px"><div><label>k (растяжение, знак): <b id="kv"></b></label><input type="range" id="k" min="-4" max="4" step=".25" value="1"></div>
<div><label>m (сдвиг по x): <b id="mv"></b></label><input type="range" id="m" min="-6" max="6" step=".5" value="0"></div>
<div><label>n (сдвиг по y): <b id="nv"></b></label><input type="range" id="n" min="-6" max="6" step=".5" value="0"></div></div></div>
<div id="plot1"></div><div class="small" style="margin-bottom:14px">Серая штриховая — базовый график, цветная — после преобразований.</div><div class="card info" id="tr"></div></div>
</div>
<script>
const tabs=$('#tabs'),pl0=new Plot($('#plot0')),out=mount('out'),MA=MI($('#ha'),{small:true,value:'1',onEnter:()=>run()}),MB=MI($('#hb'),{small:true,value:'-4',onEnter:()=>run()}),MC=MI($('#hc'),{small:true,value:'3',onEnter:()=>run()});let pl1=null;
chipsInit($('#ex'),['1|-4|3','-1|2|3','1/2|0|-2','2|-8|8','1|2|1','1|0|4'],t=>{const[a,b,c]=t.split('|');MA.set(a);MB.set(b);MC.set(c);run()},t=>{const[a,b,c]=t.split('|');return'y = '+pretty(`(${a})x^2+(${b})x+(${c})`)});
tabsInit(tabs,['Свойства и график','Преобразования графиков'],i=>{$('#p0').hidden=i!==0;$('#p1').hidden=i!==1;if(i===1){if(!pl1){pl1=new Plot($('#plot1'));tr()}else pl1.draw()}else pl0.draw()});
function run(){$('#err').textContent='';let a,b,c;try{a=evalConst(MA.value);b=evalConst(MB.value);c=evalConst(MC.value)}catch(e){$('#err').textContent='Коэффициенты должны быть числами';return}
  if(a===0){$('#err').textContent='a ≠ 0, иначе это не квадратичная функция';return}
  const f=x=>a*x*x+b*x+c,x0=snap(-b/(2*a)),y0=snap(f(x0)),D=snap(b*b-4*a*c),col='#2563eb',items=[{type:'fn',f,color:col,label:'y',html:'y = '+polyStr([c,b,a])}],P=[[x0,y0],[0,c]];
  items.push({type:'vline',x:x0,color:'#9333ea'});
  const st=[];st.push({t:'Направление ветвей',b:a>0?`a = ${num(a)} > 0 → ветви <b>направлены вверх</b>, в вершине — наименьшее значение.`:`a = ${num(a)} < 0 → ветви <b>направлены вниз</b>, в вершине — наибольшее значение.`});
  st.push({t:'Вершина параболы',b:`x₀ = −${frHTML('b','2a')} = −${frHTML(b<0?'('+num(b)+')':num(b),'2·'+(a<0?'('+num(a)+')':num(a)))} = <b>${num(x0)}</b><span class="formula">y₀ = f(${num(x0)}) = ${num(y0)}</span>Вершина: <b>(${num(x0)}; ${num(y0)})</b>`});
  st.push({t:'Ось симметрии',b:`Вертикальная прямая через вершину: <b>x = ${num(x0)}</b> (фиолетовая штриховая). Точки графика располагаются симметрично относительно неё.`});
  let roots=[];
  if(D<0)st.push({t:'Нули функции',b:`D = b² − 4ac = ${num(D)} < 0 → корней нет, парабола <b>не пересекает</b> ось Ox.`});
  else{const s=Math.sqrt(D);roots=D===0?[x0]:[snap((-b-s)/(2*a)),snap((-b+s)/(2*a))].sort((p,q)=>p-q);
    st.push({t:'Нули функции (пересечение с Ox)',b:`D = b² − 4ac = ${num(D)}${D===0?' = 0 → один корень (парабола касается оси Ox)':' > 0 → два корня'}.<span class="formula">x = ${frHTML('−b ± '+rt('D'),'2a')} → ${roots.map(r=>'x = '+num(r)).join(', &nbsp; ')}</span>`})}
  roots.forEach(r=>{items.push({type:'pt',x:r,y:0,color:col,small:true});P.push([r,0])});
  st.push({t:'Пересечение с Oy и симметричная точка',b:`При x = 0: y = c = <b>${num(c)}</b>, точка (0; ${num(c)}). Симметричная ей относительно оси — точка <b>(${num(snap(2*x0))}; ${num(c)})</b>. Удобно для построения!`});
  items.push({type:'pt',x:0,y:c,color:'#ea8a00',small:true},{type:'pt',x:snap(2*x0),y:c,color:'#ea8a00',small:true,label:''});P.push([2*x0,c]);
  items.push({type:'pt',x:x0,y:y0,color:'#e11d48',pulse:true,guide:true,label:`Вершина (${dec(x0)}; ${dec(y0)})`});
  st.push({t:'Область значений и промежутки монотонности',b:a>0?`E(f) = [${num(y0)}; +∞)<br>Убывает на (−∞; ${num(x0)}], возрастает на [${num(x0)}; +∞).`:`E(f) = (−∞; ${num(y0)}]<br>Возрастает на (−∞; ${num(x0)}], убывает на [${num(x0)}; +∞).`});
  if(D>0)st.push({t:'Знаки функции',b:a>0?`f(x) > 0 при x < ${num(roots[0])} и x > ${num(roots[1])}; f(x) < 0 при ${num(roots[0])} < x < ${num(roots[1])}.`:`f(x) > 0 при ${num(roots[0])} < x < ${num(roots[1])}; f(x) < 0 при x < ${num(roots[0])} и x > ${num(roots[1])}.`});
  pl0.set(items,P);put(out,stepsHTML(st,`вершина (${num(x0)}; ${num(y0)}), ось x = ${num(x0)}`))}
$('#go').onclick=run;run();
/* ---- преобразования ---- */
const B=[x=>x*x,x=>x**3,Math.abs,Math.sqrt,x=>1/x],BN=['x²','x³','|x|','√x','1/x'];
function tr(){const bi=+$('#base').value,k=+$('#k').value,m=+$('#m').value,n=+$('#n').value,f=B[bi],g=x=>k*f(x-m)+n;
  $('#kv').textContent=k;$('#mv').textContent=m;$('#nv').textContent=n;
  const xin=m===0?'x':`x ${m>0?'−':'+'} ${Math.abs(m)}`,inner=m===0?'x':`(${xin})`,
    bh=[inner+'<sup>2</sup>',inner+'<sup>3</sup>','|'+xin+'|',rt(xin),frHTML('1',xin)][bi],kp=k===1?'':k===-1?'−':num(k)+'·',
    fo=`y = ${kp}${bh}${n?(n>0?' + ':' − ')+Math.abs(n):''}`;
  const L=[];if(m)L.push(`<b>Сдвиг по x:</b> график сдвинут <b>${m>0?'вправо':'влево'}</b> на ${Math.abs(m)} (заменили x на x ${m>0?'−':'+'} ${Math.abs(m)}). Знак «обманчив»: минус в скобках — вправо.`);
  if(n)L.push(`<b>Сдвиг по y:</b> график сдвинут <b>${n>0?'вверх':'вниз'}</b> на ${Math.abs(n)} (y = f(x) ${n>0?'+':'−'} ${Math.abs(n)}).`);
  if(Math.abs(k)!==1&&k!==0)L.push(`<b>Растяжение вдоль Oy:</b> все y умножены на ${Math.abs(k)} — график ${Math.abs(k)>1?'«вытянут» вверх (уже)':'«сплюснут» (шире)'}.`);
  if(k<0)L.push('<b>Отражение:</b> k < 0 — график отражён относительно оси Ox (ветви перевернулись).');
  if(k===0)L.push('k = 0 — получилась прямая y = n.');
  $('#tr').innerHTML=`<h3>${fo}</h3><ul>${(L.length?L:['Преобразований нет — график совпадает с базовым.']).map(li=>`<li>${li}</li>`).join('')}</ul><div class="small">Характерная точка (вершина / центр) переехала из (0; 0) в <b>(${m}; ${n})</b>.</div>`;
  pl1.set([{type:'fn',f,color:'#9aa4b8',dash:true,w:2.5,html:'y = '+[ 'x<sup>2</sup>','x<sup>3</sup>','|x|',rt('x'),frHTML('1','x')][bi]},{type:'fn',f:g,color:'#e0412f',html:fo},{type:'pt',x:m,y:n,color:'#2563eb',pulse:true,guide:true,label:`(${dec(m)}; ${dec(n)})`}],[[m,n],[0,0]])}
['base','k','m','n'].forEach(i=>$('#'+i).oninput=()=>pl1&&tr());
</script></body></html>
